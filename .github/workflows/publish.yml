name: Package Release VSIX
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # rebuild an existing tag's GitHub Release asset
    inputs:
      tag:
        description: 'Existing tag to package, e.g. v1.0.0'
        required: true
        type: string
  workflow_call: # invoked by release.yml right after it cuts a new tag
    inputs:
      tag:
        description: 'Tag to package'
        required: true
        type: string
permissions:
  contents: write # needed to create the GitHub Release
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      # Resolves to the dispatch/call input when present, else the pushed tag.
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix media-src ci
      - name: Audit (root + media-src + vendored runtimes)
        run: npm run audit
      - name: Audit D2 compile-only Go call graph
        run: npm run audit:d2-go
      - run: npm test
      - name: Package VSIX
        run: |
          echo "VSIX=vmde-${TAG#v}.vsix" >> "$GITHUB_ENV"
          npm run package:vsix -- --out "vmde-${TAG#v}.vsix"
      - name: Create or update GitHub Release (attach the VSIX)
        run: |
          gh release create "$TAG" "$VSIX" --generate-notes \
            || gh release upload "$TAG" "$VSIX" --clobber
