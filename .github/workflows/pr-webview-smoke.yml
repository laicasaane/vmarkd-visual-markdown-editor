# PR real-VS-Code SMOKE (audit 185/3k).
#
# The fast CI (ci.yml) runs the Playwright HARNESS, which can't reproduce webview-only
# bug classes (VS Code-injected CSS, the custom-editor pipeline, worker policy). Before
# this job, that class got its first signal only from the NIGHTLY full suite — a PR
# touching webview/renderer code could merge a real-webview regression and surface it a
# day later. This runs a SMALL smoke subset (editor boots + every renderer draws) on PRs
# that touch the shipped code; nightly.yml remains the full release-blocking gate.
name: PR webview smoke (real VS Code)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'media-src/**'
      - 'media/**'
      - 'build.mjs'
      - 'test/vscode-e2e/**'

# Same pin as nightly.yml so the .vscode-test download cache is SHARED between the two
# workflows (same key). Bump together with nightly.yml.
env:
  VMDE_VSCODE_VERSION: '1.126.0'

concurrency:
  group: pr-webview-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webview-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install (root)
        run: npm ci --no-fund --no-audit
      - name: Install (media-src)
        run: npm --prefix media-src ci --no-fund --no-audit
      - name: Install (vscode-e2e harness)
        run: npm --prefix test/vscode-e2e install --no-fund --no-audit

      - name: Audit (root + media-src + vendored runtimes)
        run: npm run audit

      # This workspace is isolated from root's audit (see its package.json description) but is
      # audited HERE, where it's actually installed — task 481/482 fixed its one finding
      # (playwright SSL-verification bypass, GHSA-7mvr-c777-76hp) by bumping past the version that
      # dropped playwright._toImpl, then re-patching vscode-test-playwright's use of it (see
      # scripts/patch-vscode-test-playwright.mjs, applied automatically via this workspace's
      # postinstall — the install step above already ran it).
      - name: Audit (vscode-e2e harness)
        run: npm run audit:vscode-e2e

      - name: Canonical product identifiers
        run: npm run check:brand-identifiers

      # Playwright transpiles these specs via esbuild at run time (no tsconfig.json in this
      # tree previously existed), so no `tsc` ever read them — this is the only static net
      # over 190 spec files (task 483). Cheap (seconds), so it runs before the expensive
      # VS Code/Playwright download+install below.
      - name: Type-check (vscode-e2e)
        run: npm run typecheck:vscode-e2e

      # The suite loads dist/ + media/ via extensionDevelopmentPath, so build first.
      - name: Build
        run: node build.mjs

      - name: Cache VS Code download
        uses: actions/cache@v4
        with:
          path: test/vscode-e2e/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ env.VMDE_VSCODE_VERSION }}

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-vscode-${{ runner.os }}-${{ hashFiles('test/vscode-e2e/package.json') }}

      # --with-deps pulls the GUI/OS libraries the downloaded VS Code Electron needs too.
      - name: Install Playwright + Electron deps
        run: npm --prefix test/vscode-e2e exec -- playwright install --with-deps chromium

      # SMOKE subset, not the whole suite: boot/layout parity, all renderers draw, AND the
      # change-stability core — save-to-disk fidelity + undo-to-disk + split editing + scroll
      # preservation (task 190). This is what closes the "a save/edit regression merges green"
      # hole; the spec list is single-sourced as SMOKE_SPECS in test/vscode-e2e/playwright.config.ts,
      # next to the FAST tier (local routine run) and above the full suite the nightly gate runs.
      # Electron needs a display; xvfb-run provides a headless one.
      - name: Real-VS-Code smoke (xvfb)
        run: xvfb-run -a npm run test:vscode:smoke
