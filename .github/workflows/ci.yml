name: CI
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install (root)
        run: npm ci --no-fund --no-audit
      - name: Install (media-src)
        run: npm --prefix media-src ci --no-fund --no-audit

      # Security gate: root + media-src npm trees at low severity, plus exact-version OSV queries for
      # declared shipped vendor components (task 518). The isolated vscode-e2e workspace is installed
      # and audited in its own workflows; the slower D2 Go call-graph scan runs nightly/release-only.
      - name: Audit (root + media-src + vendored runtimes)
        run: npm run audit

      # Lint + format gate (Biome). `ci` is the no-write, CI-optimized mode
      # (run via npm so the local node_modules/.bin binary resolves, not npx).
      - name: Lint (biome)
        run: npm run lint:ci

      - name: Canonical product identifiers
        run: npm run check:brand-identifiers

      # Dead exports/files/dependencies (task 469 filed it, 498 cleared the baseline to 0,
      # this step gates it staying 0). The knip-invisible-but-live devDependencies are ignored
      # in knip.jsonc with the reasoning inline — see tasks/done/471.
      - name: Unused code (knip)
        run: npm run knip

      # Compiles the host with tsc (type-checks it) and bundles the webview.
      - name: Build
        run: node build.mjs

      # Guard against silent bundle growth (task 145 item 3): fails if main.js (glue only) or the
      # separate ELK bundle exceed their budgets — catches an engine leaking into the eager bundle.
      - name: Bundle-size budget
        run: npm run check:bundle-size

      # Guard the STARTUP parse+eval cost (task 165): fails if the eager module count or the largest
      # eager module grows — catches a heavy engine cluster (e.g. the D2 dagre pipeline) leaking back
      # into main.js even when it stays under the size ceiling's slack.
      - name: Startup-cost budget
        run: npm run check:startup-cost

      # The webview half is bundled with esbuild, which strips types without
      # checking them — so type-check it explicitly (host is covered by Build).
      - name: Type-check (webview)
        run: npm run typecheck

      # Task 503 — an ADDITIVE strict pass (useUnknownInCatchVariables/noImplicitAny/
      # strictFunctionTypes) over media-src/src/**, filtering out media-src/node_modules/vditor/**
      # diagnostics (Vditor's own source fails all three; we can't edit it — see the script's
      # header). strictNullChecks is out of scope, see tasks/503.
      - name: Type-check (webview, strict subset)
        run: npm run typecheck:strict

      # Run with coverage so the non-regression thresholds in test/vitest.config.ts
      # are enforced (task 150 item 3) — a coverage drop fails the build, not just
      # a failing assertion. Same test set as `npm test`, plus the v8 report.
      - name: Unit tests (+ coverage gate)
        run: npm run test:coverage

      # Ratchet: fail if a source module dropped to 0% coverage (task 190) — a new module must
      # ship with a test. Reads the json-summary written by the coverage run above.
      - name: Coverage module ratchet
        run: npm run check:coverage-modules

      # Cache the browser binaries (~290 MB) so they download once. The GitHub
      # ubuntu runner already ships Playwright's OS libs (only fonts would be new
      # via --with-deps, which our headless tests don't need), so we skip apt.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('media-src/package-lock.json') }}
      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npm --prefix media-src exec -- playwright install chromium
      - name: E2e tests
        run: npm --prefix media-src run test:e2e
