trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

jobs:
  - job: preview
    displayName: Preview Marketplace VSIX
    steps:
      - checkout: self
      - task: NodeTool@0
        inputs:
          versionSpec: '22.x'
      - script: |
          set -euo pipefail
          if [ "$(Build.SourceBranch)" != "refs/heads/main" ]; then
            echo "Preview publishing requires refs/heads/main" >&2
            exit 1
          fi
        displayName: Validate preview branch
      - script: npm ci
        displayName: Install root dependencies
      - script: npm --prefix media-src ci
        displayName: Install webview dependencies
      - script: npm run audit
        displayName: Audit dependencies and vendored runtimes
      - script: npm run audit:d2-go
        displayName: Audit D2 Go call graph
      - script: npm test
        displayName: Run unit tests
      - script: |
          set -euo pipefail
          production_version="$(node -p "require('./package.json').version")"
          preview_version="$(node scripts/version-contract.mjs preview "$production_version" "$(Build.BuildId)")"
          echo "##vso[task.setvariable variable=vmdeVersion]$preview_version"
          npm version "$preview_version" --no-git-tag-version --ignore-scripts
        displayName: Derive disposable preview version
      - script: |
          set -euo pipefail
          VSIX="artifacts/vmde-$(vmdeVersion)-preview.vsix"
          npm run package:vsix -- --pre-release --out "$VSIX"
        displayName: Package prerelease VSIX
      - script: |
          set -euo pipefail
          VSIX="artifacts/vmde-$(vmdeVersion)-preview.vsix"
          unzip -p "$VSIX" extension/package.json |
            node -e 'let json = ""; process.stdin.on("data", (chunk) => json += chunk); process.stdin.on("end", () => { if (JSON.parse(json).version !== process.argv[1]) process.exit(1) })' "$(vmdeVersion)"
          unzip -p "$VSIX" extension.vsixmanifest |
            grep -q '<Identity[^>]*Version="$(vmdeVersion)"'
          unzip -p "$VSIX" extension.vsixmanifest |
            grep -q 'Microsoft.VisualStudio.Code.PreRelease.*Value="true"'
        displayName: Verify prerelease archive metadata
      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: "artifacts/vmde-$(vmdeVersion)-preview.vsix"
          artifact: vmde-preview-vsix
        displayName: Publish preview VSIX artifact
      - script: ./node_modules/.bin/vsce publish --packagePath "artifacts/vmde-$(vmdeVersion)-preview.vsix" --pre-release
        displayName: Publish preview VSIX to Marketplace
        env:
          VSCE_PAT: $(VSCE_PAT)
