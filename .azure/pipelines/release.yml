trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - '*'

pr: none

pool:
  vmImage: ubuntu-latest

jobs:
  - job: release
    displayName: Production Marketplace VSIX
    steps:
      - checkout: self
        fetchDepth: 0
        fetchTags: true
      - task: NodeTool@0
        inputs:
          versionSpec: '22.x'
      - script: |
          set -euo pipefail
          node scripts/version-contract.mjs release "$(Build.SourceBranchName)" package.json package-lock.json --azure
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$(Build.SourceVersion)" "refs/remotes/origin/main"
        displayName: Validate production tag and main reachability
      - script: npm ci
        displayName: Install root dependencies
      - script: npm --prefix media-src ci
        displayName: Install webview dependencies
      - script: npm run audit
        displayName: Audit dependencies and vendored runtimes
      - script: npm run audit:d2-go
        displayName: Audit D2 Go call graph
      - script: npm test
        displayName: Run unit tests
      - script: |
          set -euo pipefail
          VSIX="artifacts/vmde-$(vmdeVersion).vsix"
          npm run package:vsix -- --out "$VSIX"
        displayName: Package production VSIX
      - script: |
          set -euo pipefail
          VSIX="artifacts/vmde-$(vmdeVersion).vsix"
          unzip -p "$VSIX" extension/package.json |
            node -e 'let json = ""; process.stdin.on("data", (chunk) => json += chunk); process.stdin.on("end", () => { if (JSON.parse(json).version !== process.argv[1]) process.exit(1) })' "$(vmdeVersion)"
          unzip -p "$VSIX" extension.vsixmanifest |
            grep -q '<Identity[^>]*Version="$(vmdeVersion)"'
          if unzip -p "$VSIX" extension.vsixmanifest | grep -q 'Microsoft.VisualStudio.Code.PreRelease.*Value="true"'; then
            exit 1
          fi
        displayName: Verify production archive metadata
      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: "artifacts/vmde-$(vmdeVersion).vsix"
          artifact: vmde-production-vsix
        displayName: Publish production VSIX artifact
      - script: ./node_modules/.bin/vsce publish --packagePath "artifacts/vmde-$(vmdeVersion).vsix"
        displayName: Publish production VSIX to Marketplace
        env:
          VSCE_PAT: $(VSCE_PAT)
